<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mano a Mano - Traductor de Lengua de Señas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mano a Mano</h1>
        <p>Traducción de Lengua de Señas en Tiempo Real</p>
    </header>
    <main>
        <div id="app-container">
            <div class="video-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output-canvas" class="output-canvas"></canvas>
            </div>
            <div id="result-container">
                <button id="audio-toggle" title="Activar/Desactivar Sonido">🔊</button>
                <p id="result-text">Iniciando cámara...</p>
            </div>
        </div>
    </main>

    <!-- Scripts de MediaPipe -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"></script>

    <script src="app.js" type="module"></script>
</body>
</html>
